# Single-host front serving: static SPA + same-origin reverse proxy to backend.
# Backend serves /api/* and /auth/* distinctly (see docs/api/route-inventory.md),
# so each prefix is proxied.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Dashboard SSE stream must not be buffered or it stalls realtime updates.
  location = /api/v1/dashboard/stream {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding off;
  }

  # Dashboard JSON API.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Kakao OAuth login/callback/session (no /api prefix on the backend).
  location /auth/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }


  # SPA client-side routing fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
