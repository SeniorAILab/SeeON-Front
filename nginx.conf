# Single-host front serving: static SPA + same-origin reverse proxy to backend.
# Backend product routes, including auth, are served under /api/v1/*.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Dashboard SSE stream must not be buffered or it stalls realtime updates.
  location = /api/v1/dashboard/stream {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding off;
  }

  # Event media raw upload is edge-token authenticated by the backend. Keep
  # the 256 MiB body allowance and request streaming scoped to this exact route.
  location ~ ^/api/v1/events/clips/[^/]+$ {
    client_max_body_size 268435456;
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_cache off;
  }

  # Event media byte streaming is isolated from the generic JSON proxy so
  # native video Range and If-Range requests reach the authenticated backend
  # without nginx buffering content into memory or temporary files.
  location ~ ^/api/v1/alerts/[^/]+/media/content$ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
  }

  # ml-config (RTSP-bearing) is proxied but guarded by the shared edge bearer
  # token at the backend (EdgeIngestTokenGuard); the edge pulls it over this
  # public origin since the production backend has no private edge network.

  # Dashboard JSON API.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Legacy unversioned auth routes are intentionally not compatibility aliases.
  location /auth/ {
    return 404;
  }


  # SPA client-side routing fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
